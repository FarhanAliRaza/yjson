name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FORCE_COLOR: "1"
  # The interpreter the Mojo compiler is installed on, independent of the one the wheel targets.
  # (Not MOJO_PYTHON: the Mojo runtime reads that name as a path to a Python executable.)
  MOJO_COMPILER_PYTHON: "3.13"

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the sdist
        run: uv build --sdist
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  corpus:
    name: Comparison corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: cache
        with:
          path: build/jsonexamples
          key: jsonexamples-${{ hashFiles('tools/fetch_corpus.py') }}
      - name: Download the simdjson-data files
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch_corpus.py
      - uses: actions/upload-artifact@v7
        with:
          name: jsonexamples
          path: build/jsonexamples
          if-no-files-found: error

  wheels:
    name: Wheel (CPython ${{ matrix.python }})
    needs: sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Install the Mojo compiler
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-mojo uv sync --locked --only-group mojo --python "$MOJO_COMPILER_PYTHON"
          echo "$PWD/.venv-mojo/bin" >> "$GITHUB_PATH"
          echo "MOJO_LIB_DIR=$(.venv-mojo/bin/python -c 'import modular; print(modular.__path__[0] + "/lib")')" >> "$GITHUB_ENV"
          .venv-mojo/bin/mojo --version
      - name: Build the wheel from the sdist
        run: uv build --wheel --python "${{ matrix.python }}" --out-dir dist dist/yjson-*.tar.gz
      - name: Bundle the Mojo runtime and set the manylinux tag
        # --disable-isa-ext-check: the extension requires AVX2 (x86-64-v3) by design.
        run: |
          UV_PROJECT_ENVIRONMENT=.venv-tools uv sync --locked --only-group wheel
          export PATH="$PWD/.venv-tools/bin:$PATH"
          auditwheel repair --ldpaths "$MOJO_LIB_DIR" --disable-isa-ext-check --wheel-dir wheelhouse dist/*.whl
          auditwheel show wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    name: Test (CPython ${{ matrix.python }})
    needs: [wheels, corpus]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-cp${{ matrix.python }}
          path: wheelhouse
      - uses: actions/download-artifact@v8
        with:
          name: jsonexamples
          path: build/jsonexamples
      - name: Install the repaired wheel and the test dependencies
        # tests/suite/requirements.txt: orjson's own suite (pytest, pytest-forked, pytz, faker, ...)
        run: |
          uv sync --locked --only-group test
          uv pip install wheelhouse/*.whl -r tests/suite/requirements.txt
      - name: Check that the installed wheel is what gets imported
        # env -i: the import must not depend on a python3 on PATH or on any environment variable.
        run: |
          env -i HOME="$HOME" .venv/bin/python - <<'PY'
          import sys, sysconfig, yjson
          assert yjson.__file__.startswith(sysconfig.get_paths()["purelib"]), yjson.__file__
          assert yjson.dumps({"ok": [1, 2.5, None]}) == b'{"ok":[1,2.5,null]}'
          print(sys.version, yjson.__file__)
          PY
      - name: Feature tests
        run: .venv/bin/python tests/check_features.py
      - name: Correctness tests (byte-identical to orjson)
        run: .venv/bin/python tests/check_correctness.py build/jsonexamples
      - name: loads() against orjson and float()
        run: .venv/bin/python tests/check_loads.py build/jsonexamples
      - name: Mojo decoder fast paths
        run: .venv/bin/python tests/check_decoder.py
      - name: loads(type=...)
        run: .venv/bin/python tests/check_typed_loads.py
      - name: Example
        run: .venv/bin/python examples/usage.py
      - name: orjson's test suite
        # The intended differences are strict expected failures (tests/suite/conftest.py).
        run: .venv/bin/python -m pytest tests/suite -q -p no:cacheprovider

  benchmarks:
    name: Benchmarks (CPython 3.13, informational)
    needs: [wheels, corpus]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-cp3.13
          path: wheelhouse
      - uses: actions/download-artifact@v8
        with:
          name: jsonexamples
          path: build/jsonexamples
      - name: Install the repaired wheel and the benchmark dependencies
        run: |
          uv sync --locked --only-group test
          uv pip install wheelhouse/*.whl
      - name: Benchmarks against orjson
        # Shared runners are noisy: these numbers are for the trend, not a gate.
        run: |
          {
            echo '## yjson vs orjson (shared runner: indicative only)'
            echo '### Corpus (paired, 10 alternating pairs per file)'
            echo '```'
            .venv/bin/python bench/bench_paired.py build/jsonexamples --pairs 10 --micro
            echo '```'
            echo '### Feature paths'
            echo '```'
            .venv/bin/python bench/bench_features.py
            echo '```'
            echo '### Per-item cost of datetime, UUID, dataclass, Enum, ...'
            echo '```'
            .venv/bin/python bench/bench_types.py
            echo '```'
            echo '### NumPy arrays'
            echo '```'
            .venv/bin/python bench/bench_numpy.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yjson/
    permissions:
      contents: read   # job-level permissions replace the workflow default; checkout needs this
      id-token: write  # PyPI trusted publishing (OIDC); no API token needed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check that the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: "{sdist,wheel-*}"
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          ls -l dist
          uv publish dist/*
